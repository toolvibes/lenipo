packages:
  - apps/*
  - packages/*
  - tools/*

# Only these dependencies may run install scripts.
allowBuilds:
  esbuild: true
  # Install-time telemetry pulled in by swagger-ui-dist; never run it.
  "@scarf/scarf": false
  # Its install script only checks versions; OpenTelemetry works without it.
  protobufjs: false

# One Node typings version across the workspace (matches the Node 24 LTS runtime).
overrides:
  "@types/node": 24.19.2
  # Patched for GHSA advisories in the copy chevrotain (via mermaid) pulls in (TL-44).
  lodash-es: 4.18.1
  # Patched for GHSA advisories in the copies Excalidraw pins (TL-53).
  "@excalidraw/excalidraw>nanoid": 3.3.20
  "@excalidraw/mermaid-to-excalidraw>nanoid": 5.1.16
