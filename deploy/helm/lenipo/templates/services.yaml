apiVersion: v1
kind: Service
metadata:
  name: {{ include "lenipo.fullname" . }}-api
  labels: {{- include "lenipo.labels" . | nindent 4 }}
spec:
  selector: {{- include "lenipo.selector" (dict "root" . "role" "api") | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lenipo.fullname" . }}-collab
  labels: {{- include "lenipo.labels" . | nindent 4 }}
spec:
  selector: {{- include "lenipo.selector" (dict "root" . "role" "collab") | nindent 4 }}
  ports:
    - { name: collab, port: 80, targetPort: collab }
---
# Metrics of every role, for Prometheus only.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lenipo.fullname" . }}-metrics
  labels:
    {{- include "lenipo.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: metrics, port: {{ .Values.metrics.port }}, targetPort: metrics }
