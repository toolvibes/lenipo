# Lenipo on Kubernetes (P-OPS-02, TL-42, E-123). One image, one Deployment per role:
# api (HTTP and realtime), collab (collaborative editing) and worker (background jobs).
# PostgreSQL, Valkey and S3 are run outside the chart and named here.

image:
  repository: ghcr.io/toolvibes/lenipo
  tag: ""          # defaults to the chart's appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Public address, e.g. https://lenipo.example.org (links in e-mails, OAuth, SAML).
publicUrl: ""

# Settings passed as environment variables (see apps/api/src/core/config.ts).
env:
  LOG_LEVEL: info
  STORAGE_DRIVER: s3
  S3_BUCKET: lenipo
  S3_REGION: us-east-1
  # S3_ENDPOINT: https://s3.example.org

# Secret values: DATABASE_URL (required), REDIS_URL, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY,
# SMTP_URL, OIDC_CLIENT_SECRET … Either name an existing Secret with these keys, or give them
# here and the chart creates one.
existingSecret: ""
secrets: {}
#  DATABASE_URL: postgres://lenipo:...@postgres:5432/lenipo
#  REDIS_URL: redis://valkey:6379

# Prometheus metrics on this port of every pod at /metrics; never exposed by the Ingress.
metrics:
  port: 9464
  serviceMonitor:
    enabled: false
    interval: 30s

# Traces: set OTEL_EXPORTER_OTLP_ENDPOINT (and OTEL_SERVICE_NAME) in env to switch them on.

api:
  replicas: 2
  resources:
    requests: { cpu: 250m, memory: 384Mi }
    limits: { memory: 1Gi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

collab:
  # More than one needs REDIS_URL (Valkey), so the instances share every edit.
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }

worker:
  # Jobs are claimed with row locks, so several workers never do the same work twice.
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

# Runs the database migrations before every install and upgrade. The pods also migrate at
# start under a lock, as a safety net.
migrations:
  job: true

# Attachments on a volume instead of S3 (STORAGE_DRIVER=local). With more than one api or
# worker pod the claim must be ReadWriteMany.
persistence:
  enabled: false
  existingClaim: ""
  mountPath: /var/lib/lenipo/files

ingress:
  enabled: true
  className: ""
  annotations: {}
  host: lenipo.example.org
  tls: []
  #  - secretName: lenipo-tls
  #    hosts: [lenipo.example.org]

# Seconds a stopping pod has: the load balancer notices (preStop), then requests and jobs finish.
shutdown:
  preStopSeconds: 5
  timeoutSeconds: 25

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities: { drop: [ALL] }

nodeSelector: {}
tolerations: []
affinity: {}
