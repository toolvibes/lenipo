{{- if and (gt (int .Values.collab.replicas) 1) (not (or .Values.secrets.REDIS_URL .Values.existingSecret)) }}
{{- fail "collab.replicas > 1 needs REDIS_URL (Valkey), so the instances share every edit" }}
{{- end }}
{{- range $role := list "api" "collab" "worker" }}
{{- $values := index $.Values $role }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tasklore.fullname" $ }}-{{ $role }}
  labels:
    {{- include "tasklore.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  {{- if not (and (eq $role "api") $.Values.api.autoscaling.enabled) }}
  replicas: {{ $values.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "tasklore.selector" (dict "root" $ "role" $role) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never fewer pods than wanted while updating (zero-downtime, E-123).
      maxUnavailable: 0
      maxSurge: 1
  template:
    {{- include "tasklore.pod" (dict "root" $ "role" $role) | nindent 4 }}
{{- if gt (int $values.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tasklore.fullname" $ }}-{{ $role }}
  labels: {{- include "tasklore.labels" $ | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {{- include "tasklore.selector" (dict "root" $ "role" $role) | nindent 6 }}
{{- end }}
{{- end }}
