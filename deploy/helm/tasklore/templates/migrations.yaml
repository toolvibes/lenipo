{{- if .Values.migrations.job }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tasklore.fullname" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "tasklore.labels" . | nindent 4 }}
  annotations:
    # Before the new pods start; the old ones keep running (expand/contract migrations, E-123).
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "tasklore.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["node", "api/dist/db/migrate-cli.js"]
          envFrom:
            - secretRef:
                name: {{ include "tasklore.secretName" . }}
{{- end }}
