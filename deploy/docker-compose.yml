# Production setup: Lenipo, PostgreSQL, Valkey and Caddy (HTTPS).
#   cd deploy && POSTGRES_PASSWORD=... SITE_ADDRESS=lenipo.example.org docker compose up -d
# Attachments are stored in the volume app-files. For S3 instead, set STORAGE_DRIVER=s3 and the
# S3_* variables (any S3-compatible service), or start the bundled RustFS:
#   STORAGE_DRIVER=s3 S3_SECRET_ACCESS_KEY=... docker compose --profile s3 up -d
name: lenipo-prod

services:
  app:
    build:
      context: ..
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://lenipo:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/lenipo
      REDIS_URL: redis://valkey:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
      S3_BUCKET: ${S3_BUCKET:-lenipo}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-lenipo}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      ATTACHMENT_MAX_MB: ${ATTACHMENT_MAX_MB:-25}
    volumes:
      - app-files:/var/lib/lenipo/files
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  postgres:
    # postgres:17-alpine with pgvector (semantic search).
    build:
      context: ./postgres
    image: lenipo-postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: lenipo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: lenipo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenipo -d lenipo"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional S3-compatible storage (RustFS, Apache-2.0); only with --profile s3.
  rustfs:
    image: rustfs/rustfs:1.0.1
    profiles: ["s3"]
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-lenipo}
      # Not published to the host; the app refuses to start with STORAGE_DRIVER=s3 but no secret.
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - rustfs-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${LENIPO_HTTP_PORT:-80}:80"
      - "${LENIPO_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  postgres-data:
  valkey-data:
  caddy-data:
  app-files:
  rustfs-data:
