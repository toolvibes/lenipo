# Production setup: Tasklore, PostgreSQL, Valkey and Caddy (HTTPS).
#   cd deploy && POSTGRES_PASSWORD=... SITE_ADDRESS=tasklore.example.org docker compose up -d
name: tasklore-prod

services:
  app:
    build:
      context: ..
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://tasklore:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/tasklore
      REDIS_URL: redis://valkey:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tasklore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: tasklore
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasklore -d tasklore"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${TASKLORE_HTTP_PORT:-80}:80"
      - "${TASKLORE_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  postgres-data:
  valkey-data:
  caddy-data:
