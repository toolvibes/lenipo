name: Release

# A tag vX.Y.Z (set by pnpm release) builds the image, pushes it to the GitHub registry and
# opens a pre-release (TL-110, E-155). `latest` follows only through the promote workflow.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Image and GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: The tag matches the version in the code
        run: test "$(node -p "require('./apps/api/package.json').version")" = "${{ steps.version.outputs.version }}"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.minor }}
            ${{ steps.version.outputs.image }}:edge
          labels: |
            org.opencontainers.image.title=Lenipo
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Pre-release with the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs notes "${{ steps.version.outputs.version }}" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease \
            --title "Lenipo ${{ steps.version.outputs.version }}" --notes-file notes.md
