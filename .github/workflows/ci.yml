name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tasklore
          POSTGRES_PASSWORD: tasklore
          POSTGRES_DB: tasklore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasklore -d tasklore"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tasklore:tasklore@localhost:5432/tasklore
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm licenses:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Generated API description and SDK types are up to date
        run: pnpm api:generate && git diff --exit-code packages/sdk
      - name: Migrations apply to an empty database
        run: pnpm db:migrate
