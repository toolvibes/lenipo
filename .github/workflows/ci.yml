name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tasklore
          POSTGRES_PASSWORD: tasklore
          POSTGRES_DB: tasklore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasklore -d tasklore"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # S3-compatible storage, so the attachment tests also run against S3.
      rustfs:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_ACCESS_KEY: tasklore
          RUSTFS_SECRET_KEY: tasklore-dev-secret
        ports:
          - 9000:9000
    env:
      DATABASE_URL: postgres://tasklore:tasklore@localhost:5432/tasklore
      TEST_S3_ENDPOINT: http://localhost:9000
      TEST_S3_ACCESS_KEY_ID: tasklore
      TEST_S3_SECRET_ACCESS_KEY: tasklore-dev-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm licenses:check
      - name: No high or critical advisories in production dependencies
        run: pnpm audit --prod --audit-level high
      - run: pnpm migrations:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Generated API description and SDK types are up to date
        run: pnpm api:generate && git diff --exit-code packages/sdk
      - name: Migrations apply to an empty database
        run: pnpm db:migrate
      - name: Load test, small (quality goals, TL-44)
        run: pnpm --filter @tasklore/loadtest loadtest:smoke
      - name: Accessibility of the built app (axe-core, WCAG 2.1 AA)
        run: |
          pnpm --filter @tasklore/web exec playwright install --with-deps chromium
          pnpm --filter @tasklore/web e2e
      - uses: azure/setup-helm@v4
      - name: Helm chart renders
        run: |
          helm lint deploy/helm/tasklore --set secrets.DATABASE_URL=postgres://x
          helm template t deploy/helm/tasklore --set secrets.DATABASE_URL=postgres://x > /dev/null
          helm template t deploy/helm/tasklore --set existingSecret=s --set collab.replicas=2 --set api.autoscaling.enabled=true --set persistence.enabled=true --set persistence.existingClaim=files --set metrics.serviceMonitor.enabled=true > /dev/null
