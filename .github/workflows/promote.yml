name: Promote

# After a release ran in Lenipo Cloud for some days without problems, it becomes `latest` for
# self-hosting (TL-110, E-155): the image gets the tags latest and X, the pre-release becomes
# the latest release, which the optional update check of instances reads.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.4.0"
        required: true
      days:
        description: "Days it must have been out"
        default: "7"
      force:
        description: "Promote even if younger (e.g. a security fix)"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Out long enough
        if: ${{ !inputs.force }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created="$(gh release view "v${{ inputs.version }}" --json createdAt --jq .createdAt)"
          age=$(( ( $(date +%s) - $(date -d "$created" +%s) ) / 86400 ))
          if [ "$age" -lt "${{ inputs.days }}" ]; then
            echo "::error::v${{ inputs.version }} is out for $age days, needs ${{ inputs.days }}."
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags latest and major version
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${{ inputs.version }}"
          docker buildx imagetools create \
            --tag "$image:latest" --tag "$image:${version%%.*}" "$image:$version"
      - name: Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v${{ inputs.version }}" --prerelease=false --latest
