<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Hallo-App</title>
    <style>
      body { font: 13px/1.5 system-ui, sans-serif; margin: 8px; color: #1f2328; }
      body.dark { color: #e6e6e6; }
      code { font-size: 12px; }
    </style>
  </head>
  <body>
    <p id="out">Warte auf Lenipo …</p>
    <script>
      // The Lenipo app protocol: ready → context, token → token, resize.
      let lenipo = null;
      const out = document.getElementById('out');
      const send = (message) => window.parent.postMessage(message, lenipo ?? '*');
      const resize = () => send({ type: 'lenipo:resize', height: document.documentElement.scrollHeight });

      window.addEventListener('message', async (event) => {
        if (event.source !== window.parent) return;
        // The first message names the Lenipo origin; later ones must come from it.
        if (lenipo && event.origin !== lenipo) return;
        const data = event.data ?? {};
        if (data.type === 'lenipo:context') {
          // Sent on load and after ready; the first one counts.
          if (lenipo) return;
          lenipo = event.origin;
          const context = data.context;
          document.body.classList.toggle('dark', context.theme === 'dark');
          out.textContent = `Hallo ${context.user?.displayName ?? ''}! Ort: ${context.kind}` +
            (context.issueKey ? `, Vorgang ${context.issueKey}` : '') +
            (context.config ? `, Einstellung „${context.config}“` : '');
          resize();
          if (context.issueKey) send({ type: 'lenipo:token' });
        } else if (data.type === 'lenipo:token') {
          const issueKey = out.textContent.match(/Vorgang (\S+)/)?.[1];
          const response = await fetch(`${data.apiBase}/issues/${issueKey}`, {
            headers: { authorization: `Bearer ${data.accessToken}` },
          });
          const issue = await response.json();
          const line = document.createElement('p');
          line.textContent = `Über die API gelesen: „${issue.summary}“ (${issue.status?.name})`;
          document.body.append(line);
          resize();
        } else if (data.type === 'lenipo:error') {
          out.textContent = `Fehler: ${data.message}`;
        }
      });
      send({ type: 'lenipo:ready' });
    </script>
  </body>
</html>
