# Infrastructure for local development. The app itself runs on the host (`pnpm dev`).
# Host ports are offset from the defaults to avoid clashes with other local projects.
name: tasklore

services:
  postgres:
    # postgres:17-alpine with pgvector (semantic search).
    build:
      context: ./deploy/postgres
    image: lenipo-postgres:17
    environment:
      POSTGRES_USER: tasklore
      POSTGRES_PASSWORD: tasklore
      POSTGRES_DB: tasklore
    ports:
      - "${TASKLORE_POSTGRES_PORT:-5440}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasklore -d tasklore"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Valkey: BSD-licensed, protocol-compatible Redis fork.
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "${TASKLORE_VALKEY_PORT:-6380}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for attachments (RustFS, Apache-2.0), used with STORAGE_DRIVER=s3.
  # Console: http://localhost:9011 (tasklore / tasklore-dev-secret).
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: tasklore
      RUSTFS_SECRET_KEY: tasklore-dev-secret
    ports:
      - "${TASKLORE_S3_PORT:-9010}:9000"
      - "${TASKLORE_S3_CONSOLE_PORT:-9011}:9001"
    volumes:
      - rustfs-data:/data

  # Catches all outgoing email in development (Mailpit, MIT): http://localhost:8026
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "${TASKLORE_SMTP_PORT:-1026}:1025"
      - "${TASKLORE_MAILPIT_PORT:-8026}:8025"

  # Only for testing OIDC sign-in: docker compose --profile oidc up -d keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    profiles: ["oidc"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "${TASKLORE_KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./dev/keycloak/tasklore-realm.json:/opt/keycloak/data/import/tasklore-realm.json:ro

volumes:
  postgres-data:
  valkey-data:
  rustfs-data:
